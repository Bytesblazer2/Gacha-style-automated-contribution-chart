name: Daily Auto Commit (Gacha System)

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Roll daily gacha and commit
        env:
          # Tip: Replace these with your personal GitHub name/email if you want 
          # these commits to color your personal profile contribution graph!
          GIT_USER_NAME: "github-actions[bot]"
          GIT_USER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"

          # 🎲 Roll a random integer between 1 and 100
          ROLL=$(( ( RANDOM % 100 ) + 1 ))

          # 🏆 Loot Table Drop Logic:
          # 50% Common (1 commit)
          # 30% Rare (3 commits)
          # 15% Epic (6 commits)
          # 5%  Legendary (12 commits)
          if [ $ROLL -le 50 ]; then
            COMMITS=1
            TIER="Common"
            SHADE="Light Green"
          elif [ $ROLL -le 80 ]; then
            COMMITS=3
            TIER="Rare"
            SHADE="Medium Green"
          elif [ $ROLL -le 95 ]; then
            COMMITS=6
            TIER="Epic"
            SHADE="Dark Green"
          else
            COMMITS=12
            TIER="Legendary"
            SHADE="Deepest Green"
          fi

          echo "=========================================="
          echo "🎲 GACHA ROLL: $ROLL"
          echo "✨ REWARD TIER: $TIER ($SHADE)"
          echo "📦 COMMITS TO MAKE: $COMMITS"
          echo "=========================================="

          # Execute weighted loop with 1-second timestamp buffers
          for (( i=1; i<=COMMITS; i++ )); do
            date --iso-8601=seconds >> activity.txt
            git add activity.txt
            git commit -m "🎮 Gacha Pull #$i/$COMMITS [$TIER Drop] [skip ci]"
            sleep 1
          done

          # Prevent pushing conflicts if repo is updated elsewhere
          git pull --rebase origin main
          git push

